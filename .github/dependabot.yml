version: 2
updates:
  # Minor and patch updates arrive as one grouped weekly PR; majors come one
  # at a time so each can be reviewed on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Held back until the lint toolchain supports them: typescript-eslint has no
      # TS 7 support yet, and eslint-plugin-react breaks on ESLint 10.
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: eslint
        versions: [">=10"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
