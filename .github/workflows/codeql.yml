name: CodeQL

# GitHub's semantic code scanning (free for public repos). Findings appear
# under the repo's Security tab and as PR annotations.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # weekly, catches newly published query packs
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
